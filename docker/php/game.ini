; PHP settings for the game container (on top of php.ini-production).
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
memory_limit = 256M
upload_max_filesize = 2M
post_max_size = 8M
max_execution_time = 30
date.timezone = UTC
session.cookie_httponly = 1
session.use_strict_mode = 1
opcache.enable = 1
opcache.validate_timestamps = 0
